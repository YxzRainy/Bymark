<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0d" />
    <meta name="description" content="Bymark 留印 — 让文字带着作者身份一起传播。" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>留印</title>
    <style>
      body { margin: 0; }
      .boot-screen { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #111214; color: #f4f4f5; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .boot-content { display: flex; align-items: center; gap: 14px; }
      .boot-mark { width: 38px; height: 38px; border: 1px solid currentColor; border-radius: 11px; display: grid; place-items: center; font-size: 20px; font-weight: 600; }
      .boot-name { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .08em; }
      .boot-status { margin: 0; opacity: .6; font-size: 12px; }
      #root[data-boot-theme="light"] .boot-screen { background: #f4f5f6; color: #161719; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-live="polite">
        <div class="boot-content">
          <div class="boot-mark" aria-hidden="true">留</div>
          <div><p class="boot-name">留印</p><p class="boot-status">正在恢复工作区…</p></div>
        </div>
      </div>
    </div>
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('bymark-settings-v1') || 'null');
        const theme = saved?.state?.theme;
        if (theme === 'light' || theme === 'white' || (!theme && !matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.getElementById('root').dataset.bootTheme = 'light';
        }
      } catch { /* The startup view can use its dark fallback. */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
